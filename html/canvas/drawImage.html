<!DOCTYPE html>
<html class="no-js">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title></title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="">
</head>

<body>
    <img src="/src/assets/bb1.jpg" id="testImage">
    <br>
    <canvas id="mycanvas" width="512" height="384"></canvas>
    <script type="text/javascript">

        var cvs = document.getElementById("mycanvas");
        var ctx = cvs.getContext("2d");
        var img = document.getElementById("testImage");

        img.onload = function () {
            console.log('width', img.width);
            console.log('width', img.height);
            /**
             * context.drawImage(image, dx, dy);
             * context.drawImage(image, dx, dy, dWidth, dHeight);
             * context.drawImage(image, sx, sy, sWidth, sHeight, dx, dy, dWidth, dHeight);

             * drawImage()方法有一个非常怪异的地方，大家一定要注意，
             * 那就是5参数和9参数用法的参数位置是不一样的，
             * 这个和一般的API有所不同。一般API可选参数是放在后面。
             * 但是，这里的drawImage()使用9个参数时候，可选参数sx，sy，sWidth和sHeight是在前面的。
             * 如果不注意这一点，有些表现会让你无法理解。
             * */

            ctx.drawImage(img, 0, 0, img.width, img.height, 0, 0, 512, 384);
        }
    </script>
</body>

</html>
